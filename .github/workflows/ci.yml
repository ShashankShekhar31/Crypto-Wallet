name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wallet_admin
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: crypto_wallet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet_admin -d crypto_wallet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      valkey:
        image: valkey/valkey:8-alpine
        env:
          VALKEY_PASSWORD: ci-valkey-password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli -a ci-valkey-password ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
        ports:
          - 19092:19092
        options: >-
          --health-cmd "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
        command: >
          redpanda start
          --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
          --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
          --rpc-addr redpanda:33145
          --advertise-rpc-addr redpanda:33145
          --mode dev-container
          --smp 1
          --default-log-level=info

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Database migrations
        run: pnpm --filter @crypto-wallet/storage migrate
        env:
          DATABASE_URL: postgresql://wallet_admin:ci-postgres-password@localhost:5432/crypto_wallet

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://wallet_admin:ci-postgres-password@localhost:5432/crypto_wallet
          REDIS_URL: redis://localhost:6379
          KAFKA_BROKERS: 127.0.0.1:19092
          KAFKA_TOPIC: crypto-wallet.events
          KAFKA_CLIENT_ID: crypto-wallet-api
          KAFKA_CONSUMER_GROUP: crypto-wallet-api

      - name: Build
        run: pnpm build
