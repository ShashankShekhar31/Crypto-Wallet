services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: crypto-wallet-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    environment:
      MINIO_ROOT_USER: localadmin
      MINIO_ROOT_PASSWORD: localadmin-change-me

volumes:
  minio_data:
