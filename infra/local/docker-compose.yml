services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: crypto-wallet-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    environment:
      MINIO_ROOT_USER: localadmin
      MINIO_ROOT_PASSWORD: localadmin-change-me

  prometheus:
    container_name: crypto-wallet-prometheus
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

    restart: unless-stopped

  grafana:
    container_name: crypto-wallet-grafana
    image: grafana/grafana:13.2.1

    ports:
      - "127.0.0.1:3001:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    restart: unless-stopped

  loki:
    container_name: crypto-wallet-loki
    image: grafana/loki:3.7.3

    command:
      - -config.file=/etc/loki/local-config.yaml

    ports:
      - "127.0.0.1:3100:3100"

    volumes:
      - loki_data:/loki

    restart: unless-stopped

  alloy:
    container_name: crypto-wallet-alloy
    image: grafana/alloy:v1.18.1

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    ports:
      - "127.0.0.1:12345:12345"

    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./../../logs:/var/log/crypto-wallet:ro
      - alloy_data:/var/lib/alloy/data

    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: crypto-wallet-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: crypto-wallet-valkey
    restart: unless-stopped

    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${VALKEY_PASSWORD}

    ports:
      - "127.0.0.1:${VALKEY_PORT}:6379"

    volumes:
      - valkey_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - valkey-cli -a "$${VALKEY_PASSWORD}" ping | grep PONG
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minio_data:
  postgres_data:
  valkey_data:
  prometheus_data:
    name: local_prometheus_data
  grafana_data:
    name: local_grafana_data
  loki_data:
    name: local_loki_data
  alloy_data:
    name: local_alloy_data
