services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: crypto-wallet-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    environment:
      MINIO_ROOT_USER: localadmin
      MINIO_ROOT_PASSWORD: localadmin-change-me

  postgres:
    image: postgres:17-alpine
    container_name: crypto-wallet-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: crypto-wallet-valkey
    restart: unless-stopped

    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}

    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${VALKEY_PASSWORD}

    ports:
      - "127.0.0.1:${VALKEY_PORT}:6379"

    volumes:
      - valkey_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - valkey-cli -a "$${VALKEY_PASSWORD}" ping | grep PONG
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minio_data:
  postgres_data:
  valkey_data:
